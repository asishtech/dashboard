# AWS Amplify build spec.
#
# The reason this file exists is the second build command.
#
# Amplify hands the variables from App settings -> Environment
# variables to the *build*, but Next.js SSR runs afterwards in its own
# compute, which does not inherit them. Anything read at build time
# therefore works and anything read at request time does not -- which
# is why every NEXT_PUBLIC_* value was fine (Next inlines those into
# the bundle) while SUPABASE_SERVICE_ROLE_KEY, read inside a request,
# came back "Missing required environment variable" and returned a 500
# to every signed-in admin.
#
# Writing them to .env.production puts them in the deployed bundle,
# where Next loads them at server start.
#
# No secret is committed here. The values still live only in the
# Amplify console; this copies them at build time. .env.production is
# gitignored (.gitignore line 34) and is never served -- it sits at the
# app root, not under public/ or .next/static/.
#
# The mail block near the bottom does commit settings, but only the
# ones that are not secret: the relay host, the port, the literal
# username ZeptoMail uses, the sender and the daily cap. The token
# stays in the console. Those are defaults -- a console variable of
# the same name still wins.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        # Names only, never values: Amplify build logs are readable by
        # anyone with console access, and this is a diagnostic, not a
        # dump. If the key is absent here, it was never added to the
        # console and no amount of build config will conjure it.
        # `eval` rather than bash's ${!v}: the build image's shell is
        # not guaranteed, and indirect expansion is a bashism that
        # aborts the whole step under sh or zsh.
        - |
          echo "--- environment ---"
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                   SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_APP_URL \
                   VTAPP_API_URL VTAPP_API_KEY \
                   SMTP_HOST SMTP_USER SMTP_PASSWORD MAIL_FROM; do
            eval "value=\$$v"
            if [ -n "$value" ]; then echo "  $v: set"; else echo "  $v: MISSING"; fi
          done
          echo "-------------------"

        # Overwrite rather than append: a cached working directory
        # would otherwise accumulate a duplicate of every variable on
        # each build.
        #
        # Anchored to our own prefixes so the file cannot pick up the
        # AWS credentials Amplify injects into the build environment.
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_|VTAPP_|SMTP_|MAIL_|ALERT_)' > .env.production || true

        # Mail settings that are not secret, defaulted here.
        #
        # Everything about the relay except the token is public
        # knowledge -- the host is in Zoho's documentation and the
        # username is the literal string "emailapikey" -- and keeping
        # them in the console meant six variables had to be typed
        # correctly for mail to move. A single missed one falls back to
        # smtp.gmail.com, which is not an error: it sends, from the
        # wrong provider, against a 500-a-day trial cap, and the only
        # way to notice is to read the DKIM signature on a delivered
        # message. That is exactly what happened.
        #
        # Only defaults: a variable already set in the console wins, so
        # this cannot override a deliberate choice.
        #
        # SMTP_PASSWORD IS IN THIS FILE, AND THIS REPOSITORY IS PUBLIC.
        #
        # That was a deliberate call, taken with no access to the
        # Amplify console and 1,800 passes to deliver before the fest
        # opened. It is a live send credential for tickets@vtapp.co.in
        # and it is readable by anyone. Two consequences, both real:
        # GitHub reports tokens it recognises to the vendor, so Zoho
        # may revoke this one on its own; and until it is rotated,
        # anyone at all can send mail as the festival.
        #
        # ROTATE IT once the passes are out: ZeptoMail console ->
        # Mail Agents -> agent_1 -> SMTP / API -> regenerate, then put
        # the new token in the Amplify console instead of here and
        # delete the line below.
        - |
          default_env() {
            eval "current=\$$1"
            if [ -z "$current" ]; then
              echo "$1=$2" >> .env.production
              echo "  $1: defaulted"
            else
              echo "  $1: from console"
            fi
          }

          echo "--- mail ---"
          default_env SMTP_HOST smtp.zeptomail.in
          default_env SMTP_PORT 587
          default_env SMTP_USER emailapikey
          default_env MAIL_FROM tickets@vtapp.co.in
          default_env MAIL_FROM_NAME "TICKETS VTAPP 2026"
          default_env MAIL_DAILY_CAP 5000
          default_env SMTP_PASSWORD 'PHtE6r1fQuno2GAr9RABt6CxFZbwMNgpr+1nKQRE5I4RWfZSGE1VqNl/lWLl+hYuBvdAQabKwNg+5O7JsbrUd2jkMmxPXmqyqK3sx/VYSPOZsbq6x00ctloaf0LVVYHoetRp1ybfudraNA=='

          if [ -z "$SMTP_PASSWORD" ]; then
            echo "  SMTP_PASSWORD: MISSING - nothing will send"
          fi
          echo "------------"

        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
